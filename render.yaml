services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: portfolio-tracker-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend (React static site) ──────────────────────────
  - type: web
    name: portfolio-tracker-ui
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-tracker-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
